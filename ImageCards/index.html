<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cards</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <style>
            * {
                font-family: "Montserrat", sans-serif;
                font-optical-sizing: auto;
                font-weight: 500;
                font-style: normal;
                font-size: small;
            }
            div.gallery {
                border: 1px solid #ccc;
                margin: 15px;
                max-width: 300px;
                height: 400px;
                text-decoration: none;
                color: black;
                position: relative;
                left: 0;
                top: 0;
                overflow: hidden;
                border-radius: 10px;
            }
            div.gallery img {
                width: 100%;
                filter: saturate(0);
                height: 400px;
                padding: 0;
                object-fit: cover;
                transition: 0.8s;
            }
            div.gallery div.desc {
                width: 100%;
                height: 200px;
                position: absolute;
                bottom: -200px;
                left: 0;
                text-align: center;
                padding-top: 0rem;
                background: rgba(255, 255, 255, 0.8);
                opacity: 0;
                transition: 0.8s;
            }
            div.gallery:hover div.desc {
                opacity: 1;
                bottom: 0px;
                padding-top: 5rem;
            }
            div.gallery:hover img {
                filter: saturate(2);
                filter: blur(2px);
                scale: calc(1.2);
                transition: 0.8s;
            }
        </style>
    </head>
    <body>
        <div class="gallery">
            <a target="_blank" href="eduard.jpg">
                <img src="eduard.jpg" alt="eduard" />
            </a>
            <div class="desc">This the normal text for ecard.</div>
        </div>
    </body>
</html>
